<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="60%" stop-color="#0D0D0D" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Circle / Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Royal Crown Emblem -->
  <g filter="url(#goldGlow)">
    <path d="M160 210 L190 280 L322 280 L352 210 L296 240 L256 160 L216 240 Z" fill="url(#goldGrad)" />
    <!-- Crown Jewels / Orbs -->
    <circle cx="160" cy="205" r="9" fill="#FFF7C2" />
    <circle cx="256" cy="155" r="11" fill="#FFF7C2" />
    <circle cx="352" cy="205" r="9" fill="#FFF7C2" />
    <circle cx="216" cy="235" r="7" fill="#E5C158" />
    <circle cx="296" cy="235" r="7" fill="#E5C158" />
  </g>

  <!-- Crown Base Band -->
  <rect x="186" y="286" width="140" height="14" rx="7" fill="url(#goldGrad)" />

  <!-- Luxury Brand Monogram 'A' & Limousine Wings -->
  <g fill="url(#goldGrad)">
    <!-- Sleek Car Silhouette / Wing -->
    <path d="M120 330 C180 305 332 305 392 330 C360 340 320 345 256 345 C192 345 152 340 120 330 Z" opacity="0.9" />
  </g>

  <!-- ALLORD CAR Text in Gold -->
  <text x="256" y="405" font-family="'Cinzel', 'Cairo', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle">
    ALLORD
  </text>
  <text x="256" y="435" font-family="'Outfit', 'Tajawal', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#A3A3A3" text-anchor="middle">
    LUXURY TRANSPORT
  </text>
</svg>
